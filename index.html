function mediaCard(item,{overview=false,compact=false}={}){const saved=isFavorite(item);return `<article class="media-card ${compact?'compact':''}"><button type="button" class="heart ${saved?'saved':''}" data-action="favorite" data-id="${esc(item.id)}" aria-label="${saved?t('savedFavorite'):t('addFavorite')}">${saved?'♥':'♡'}</button><a href="#/details/${esc(item.kind)}/${encodeURIComponent(item.id)}"><div class="poster">${item.poster?`<img src="${esc(item.poster)}" alt="${esc(item.title)}" loading="lazy">`:''}<span class="badge">${item.kind==='tv'?t('series'):t('film')}</span><span class="score">★ ${displayRating(item)}</span></div><div class="card-body"><div class="card-title">${esc(item.title)}</div><div class="card-meta">${year(item.releaseDate)} · ${esc(sourceLabel(item))}</div>${overview?`<div class="card-overview">${esc(item.overview)}</div>`:''}</div></a></article>`}
function empty(icon,title,text,action=''){return `<div class="empty"><div><div style="font-size:32px;color:var(--accent)">${icon}</div><strong>${esc(title)}</strong><p>${esc(text)}</p>${action}</div></div>`}
function bottomLink(path,label,icon){const active=routeName()===path;return `<a class="bottom-link ${active?'active':''}" href="#/${path}"><b>${icon}</b><span>${esc(label)}</span></a>`}
function layout(content){const settingsRoute=routeName()==='settings';return `<div class="shell"><div class="grain"></div><header class="topbar"><nav class="container nav"><a href="#/home" class="brand"><span class="brand-mark">▰</span><span><strong>HALAPINO</strong><span>${esc(t('tagline'))}</span></span></a><div class="nav-links">${link('home',t('home'),'⌂')}${link('search',t('discover'),'⌕')}${link('shorts',t('shorts'),'✦')}${link('public-domain',t('library'),'▣')}${link('favorites',t('favorites'),'♡')}${link('lists',bt('lists'),'☷')}</div><div class="nav-actions"><button class="utility" type="button" data-action="language" aria-label="Change language">${state.language==='ar'?'EN':'ع'}</button><a class="utility ${settingsRoute?'active':''}" href="#/settings" aria-label="${esc(t('settings'))}">⚙</a></div></nav></header><main>${content}</main><nav class="bottom-nav" aria-label="${state.language==='ar'?'التنقل الرئيسي':'Primary navigation'}">${bottomLink('home',t('home'),'⌂')}${bottomLink('search',t('discover'),'⌕')}${bottomLink('shorts',t('shorts'),'✦')}${bottomLink('public-domain',t('library'),'▣')}${bottomLink('lists',bt('lists'),'☷')}</nav><footer class="footer"><div class="container footer-row"><span class="footer-brand">HALAPINO</span><span>${esc(t('creditsCopy').split('. ')[0])}</span><a href="#/credits">${esc(t('credits'))}</a></div></footer></div>`}
function homePage(){const featured=LEGAL_LIBRARY.filter(familyVisible).slice(0,4);return `<section class="hero"><div class="container"><div class="hero-copy"><span class="eyebrow">▰ ${esc(t('heroEye'))}</span><h1>${t('hero')}</h1><p>${esc(t('heroCopy'))}</p><div class="actions"><a class="btn btn-primary" href="#/search">⌕ ${esc(t('start'))}</a><a class="btn btn-ghost" href="#/public-domain">▣ ${esc(t('openLibrary'))}</a><a class="btn btn-ghost" href="#/shorts">▶ ${esc(t('openShorts'))}</a></div></div></div></section><section class="container section"><div class="section-top"><div><span class="eyebrow">${esc(t('licensedShelf'))}</span><h2 class="section-title">${esc(t('featured'))}</h2></div><a class="section-link" href="#/search">${esc(t('exploreMore'))} ←</a></div><div class="media-rail">${featured.map(item=>mediaCard(item)).join('')}</div></section><section class="container section"><div class="cta-band"><span style="font-size:29px;color:var(--accent)">♡</span><h2>${esc(t('buildList'))}</h2><p>${esc(t('buildCopy'))}</p><a class="btn btn-ghost" href="#/favorites">${esc(t('openFavorites'))} ←</a></div></section>`}
function searchPage(){const s=state.search;let resultsMarkup='';if(s.status==='loading')resultsMarkup=empty('◌',t('searching'),'');else if(s.status==='done')resultsMarkup=s.results.length?`<div class="result-bar"><h2>${esc(t('results'))}</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="status-chip">${esc(s.source||'')}</span><span class="status-chip">${s.results.length} ${esc(t('shown'))}</span></div></div><div class="media-grid">${s.results.map(item=>mediaCard(item,{overview:true})).join('')}</div>`:empty('⌕',t('noResults'),t('noResultsCopy'));else resultsMarkup=empty('⌕',t('enterTwo'),t('enterTwoCopy'));return `<div class="container page"><section class="page-head"><span class="eyebrow">${esc(t('discovery'))}</span><h1 class="page-title">${esc(t('findStory'))}</h1><p class="page-copy">${esc(t('searchCopy'))}</p><form class="search-panel" data-form="search"><div class="search-box"><span style="color:var(--accent)">⌕</span><input id="searchQuery" name="query" value="${esc(s.query)}" placeholder="${esc(t('query'))}" autocomplete="off"><button type="submit" aria-label="${esc(t('start'))}">⌕</button></div><div class="filters"><div class="field"><label>${esc(t('content'))}</label><select name="kind"><option value="all" ${s.kind==='all'?'selected':''}>${esc(t('all'))}</option><option value="movie" ${s.kind==='movie'?'selected':''}>${esc(t('movies'))}</option><option value="tv" ${s.kind==='tv'?'selected':''}>${esc(t('series'))}</option></select></div><div class="field"><label>${esc(t('genre'))}</label><select name="genre"><option value="all">${esc(t('allGenres'))}</option><option value="public-domain">Public domain</option></select></div><div class="field"><label>${esc(t('year'))}</label><select name="year"><option value="all">${esc(t('allYears'))}</option>${Array.from({length:30},(_,i)=>new Date().getFullYear()-i).map(value=>`<option value="${value}" ${s.year===String(value)?'selected':''}>${value}</option>`).join('')}</select></div><div class="field"><label>${esc(t('minRating'))}</label><select name="minRating"><option value="0">${esc(t('anyRating'))}</option><option value="6">6.0+</option><option value="7">7.0+</option><option value="8">8.0+</option></select></div><div class="field"><label>${esc(t('sort'))}</label><select name="sort"><option value="relevance" ${s.sort==='relevance'?'selected':''}>${esc(t('relevance'))}</option><option value="rating" ${s.sort==='rating'?'selected':''}>${esc(t('topRated'))}</option><option value="newest" ${s.sort==='newest'?'selected':''}>${esc(t('newest'))}</option></select></div></div></form></section><section class="section">${resultsMarkup}</section></div>`}
function shortsPage(){if(configured()&&!state.shorts.loaded&&!state.shorts.loading)setTimeout(loadShorts,0);const items=state.shorts.items;const player=state.shorts.active?`<div class="shorts-player"><div class="player-head"><div><span class="eyebrow">${esc(t('watchInside'))}</span><h2>${esc(state.shorts.active.title)}</h2><p style="margin:5px 0 0;color:#aaa49d;font-size:12px">${esc(bt('sourceOnly'))}</p></div><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-small" data-action="save-short">${listHas('shorts',state.shorts.active)?'♥ ':''}${esc(listHas('shorts',state.shorts.active)?bt('savedShort'):bt('saveShort'))}</button><button class="btn btn-ghost btn-small" data-action="close-short">${esc(t('close'))}</button></div></div><div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(state.shorts.active.trailerKey)}?autoplay=1&rel=0" title="${esc(state.shorts.active.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></div>`:'';const grid=state.shorts.loading?empty('◌',t('searching'),''):items.length?`<div class="shorts-grid">${items.map(item=>`<button type="button" class="short-card" data-action="play-short" data-id="${esc(item.id)}">${item.poster?`<img src="${esc(item.poster)}" alt="">`:''}<div class="short-card-content"><span class="play-round">▶</span><h2>${esc(item.title)}</h2><p>${esc(t('watchInside'))}</p></div></button>`).join('')}</div>`:empty('✦',t('shortsUnavailable'),t('shortsUnavailableCopy'));return `<div class="container page"><section class="page-head"><span class="eyebrow">${esc(t('pulse'))}</span><h1 class="page-title">${esc(t('shortsTitle'))}</h1><p class="page-copy">${esc(t('shortsCopy'))}</p></section>${player}<section class="section" style="padding-top:12px">${grid}</section></div>`}
function libraryPage(){const items=LEGAL_LIBRARY.filter(item=>familyVisible(item)&&(!state.savedOnly||isFavorite(item))&&(`${item.title} ${item.overview}`).toLowerCase().includes(state.libraryQuery.toLowerCase()));const player=state.libraryActive&&familyVisible(state.libraryActive)?`<div class="archive-player"><div class="player-head"><div><span class="eyebrow" style="color:var(--library)">${esc(t('watchInside'))}</span><h2>${esc(state.libraryActive.title)}</h2><p style="margin:5px 0 0;color:#969d98">${year(state.libraryActive.releaseDate)} · ${esc(state.libraryActive.providerName)}</p></div><button class="btn btn-ghost btn-small" data-action="close-library">${esc(t('close'))}</button></div><div class="video-frame"><iframe src="${esc(state.libraryActive.playbackUrl)}" title="${esc(state.libraryActive.title)}" allowfullscreen></iframe></div><a class="license-link" href="${esc(state.libraryActive.licenseUrl)}" target="_blank" rel="noreferrer">${esc(t('openLicense'))} ↗</a></div>`:'';return `<div class="container page"><section class="page-head"><div class="library-hero"><span class="eyebrow">${esc(t('freeLegal'))}</span><h1>${t('freeTitle')}</h1><p>${esc(t('freeCopy'))}</p><div class="library-tags"><span>◉ ${esc(t('publicOnly'))}</span><span>▣ ${esc(t('sourceArchive'))}</span><button class="btn btn-ghost btn-small" data-action="library-surprise">▶ ${esc(t('surprise'))}</button></div></div></section>${player}<section class="section" style="padding-top:8px"><div class="section-top"><div><span class="eyebrow" style="color:var(--library)">${esc(t('licensedShelf'))}</span><h2 class="section-title">${esc(t('openLibrary'))}</h2></div><span class="status-chip">${items.length} ${esc(t('works'))}</span></div><div class="library-tools"><input id="libraryQuery" value="${esc(state.libraryQuery)}" placeholder="${esc(t('searchLibrary'))}"><button class="btn btn-ghost btn-small ${state.savedOnly?'active':''}" data-action="saved-filter">${state.savedOnly?'♥':'♡'} ${esc(t('saved'))} (${state.favorites.filter(familyVisible).length})</button><button class="btn btn-ghost btn-small" data-action="library-surprise">▶ ${esc(t('surprise'))}</button></div><div class="media-grid" style="margin-top:18px">${items.length?items.map(item=>mediaCard(item,{overview:true})).join(''):empty('⌂',state.familyMode?(state.language==='ar'?'لا توجد أعمال عائلية مطابقة':'No matching family titles'):t('noSaved'),state.familyMode?(state.language==='ar'?'أضف عملاً مناسباً إلى القائمة العائلية من صفحة التفاصيل.':'Add a suitable title to the family list from its detail page.'):t('noFavoritesCopy'))}</div></section></div>`}
function favoritesPage(){const items=state.favorites;return `<div class="container page"><section class="page-head favorites-hero"><span class="eyebrow">${esc(t('favoritesEye'))}</span><h1 class="page-title">${esc(t('favoritesTitle'))}</h1><p class="page-copy">${esc(t('favoritesCopy'))}</p><span class="count-pill">${items.length} ${esc(t('savedWorks'))}</span></section><section class="section" style="padding-top:10px">${items.length?`<div class="media-grid">${items.map(item=>mediaCard(item,{overview:true})).join('')}</div>`:empty('♡',t('noFavorites'),t('noFavoritesCopy'),`<a class="btn btn-primary" href="#/search">✦ ${esc(t('start'))}</a>`)}</section></div>`}
function settingsPage(){const primary=configured()?t('configured'):t('primaryEmpty');return `<div class="container page"><section class="page-head"><div class="settings-hero"><span class="eyebrow">HALAPINO</span><h1>${esc(t('settingsTitle'))}</h1><p>${esc(t('settingsCopy'))}</p></div><div class="settings-grid"><section class="settings-panel"><div class="settings-title"><span class="settings-icon">◎</span><div><h2>${esc(t('language'))}</h2><p>${esc(t('languageCopy'))}</p></div></div><div class="preference-row"><button class="preference ${state.language==='ar'?'active':''}" data-action="set-language" data-value="ar">العربية <span>${state.language==='ar'?'✓':''}</span></button><button class="preference ${state.language==='en'?'active':''}" data-action="set-language" data-value="en">English <span>${state.language==='en'?'✓':''}</span></button></div></section><section class="settings-panel"><div class="settings-title"><span class="settings-icon">◌</span><div><h2>${esc(t('theme'))}</h2><p>${esc(t('themeCopy'))}</p></div></div><button class="theme-choice ${state.theme==='gold'?'active':''}" data-action="set-theme" data-value="gold"><span class="swatch gold"></span>${esc(t('themeGold'))}<span class="tick">${state.theme==='gold'?'✓':''}</span></button><button class="theme-choice ${state.theme==='ocean'?'active':''}" data-action="set-theme" data-value="ocean"><span class="swatch ocean"></span>${esc(t('themeOcean'))}<span class="tick">${state.theme==='ocean'?'✓':''}</span></button><button class="theme-choice ${state.theme==='plum'?'active':''}" data-action="set-theme" data-value="plum"><span class="swatch plum"></span>${esc(t('themePlum'))}<span class="tick">${state.theme==='plum'?'✓':''}</span></button></section><section class="settings-panel wide"><div class="settings-title"><span class="settings-icon">⌘</span><div><h2>${esc(t('sourceChain'))}</h2><p>${esc(t('sourceChainCopy'))}</p></div></div><div class="source-chain"><div class="source-step"><span class="source-index">1</span><div><strong>${esc(t('primary'))}</strong><p>${esc(primary)}</p></div></div><div class="source-step"><span class="source-index">2</span><div><strong>Internet Archive</strong><p>${esc(t('archiveFallback'))}</p></div></div><div class="source-step"><span class="source-index">3</span><div><strong>Wikimedia Commons</strong><p>${esc(t('archiveFallback'))}</p></div></div></div></section><section class="settings-panel wide"><div class="settings-title"><span class="settings-icon">⌘</span><div><h2>${esc(t('providerKeys'))}</h2><p>${esc(t('providerKeysCopy'))}</p></div></div><div class="key-slots"><div class="key-slot"><code>CATALOG_API_BASE_URL=YOUR API BASE URL</code><span>${esc(t('baseSlot'))}</span></div><div class="key-slot"><code>CATALOG_API_KEY=YOUR API KEY</code><span>${esc(t('keySlot'))}</span></div></div><p class="page-copy" style="margin-bottom:0">⚠ ${esc(t('providerNote'))}</p></section></div></section></div>`}
function creditsPage(){return `<div class="container page"><article class="credits-card"><span class="eyebrow">${esc(t('creditsEye'))}</span><h1>${esc(t('creditsTitle'))}</h1><p>${esc(t('creditsCopy'))}</p><div class="compliance-grid"><section class="compliance"><h2>◉ ${esc(t('commercial'))}</h2><p>${esc(t('commercialCopy'))}</p></section><section class="compliance"><h2>⌘ ${esc(t('limits'))}</h2><p>${esc(t('limitsCopy'))}</p></section></div></article></div>`}
function detailsPage(kind,id){const item=findMedia(id);if(!item)return `<div class="container page"><section class="section">${empty('!',t('noResults'),t('noResultsCopy'),`<a class="btn btn-primary" href="#/search">${esc(t('backSearch'))}</a>`)}</section></div>`;const similar=LEGAL_LIBRARY.filter(media=>media.id!==item.id&&!isHidden(media)).slice(0,4);const watch=item.playbackUrl?`<div class="detail-section"><h2>${esc(t('watch'))}</h2><div class="video-frame">${item.source==='wikimedia'?`<video controls data-progress-ready="false" src="${esc(item.playbackUrl)}"></video>`:`<iframe src="${esc(item.playbackUrl)}" title="${esc(item.title)}" allowfullscreen></iframe>`}</div>${state.watchProgress[key(item)]?`<span class="status-chip" style="margin-top:10px">${esc(bt('watchProgress'))}: ${Math.floor((state.watchProgress[key(item)].current/state.watchProgress[key(item)].duration)*100)}%</span>`:''}</div>`:'';const cast=item.cast?.length?`<div class="cast-grid">${item.cast.map(person=>`<div class="cast-card"><span class="avatar">♙</span><div><strong>${esc(person.name)}</strong><span>${esc(person.character||t('cast'))}</span></div></div>`).join('')}</div>`:`<p>${esc(t('noCast'))}</p>`;return `<section class="details-hero"><div class="container"><a class="back-link" href="${esc(state.lastRoute||'#/search')}">← ${esc(t('backSearch'))}</a><div class="details-intro"><div class="detail-poster">${item.poster?`<img src="${esc(item.poster)}" alt="${esc(item.title)}">`:''}</div><div><span class="detail-kind">${esc(item.kind==='tv'?t('tv'):t('film'))}</span><h1>${esc(item.title)}</h1>${item.originalTitle&&item.originalTitle!==item.title?`<p class="original-title">${esc(item.originalTitle)}</p>`:''}<div class="metrics"><span class="metric">★ ${displayRating(item)} / 10</span><span class="metric">◷ ${year(item.releaseDate)}</span>${item.runtime?`<span class="metric">◌ ${item.runtime} ${esc(t('runtime'))}</span>`:''}</div><div class="genres">${(item.genres||[]).map(genre=>`<span class="genre">${esc(genre)}</span>`).join('')}</div><button class="btn ${isFavorite(item)?'btn-primary':'btn-ghost'}" style="margin-top:20px" data-action="favorite" data-id="${esc(item.id)}">${isFavorite(item)?'♥ '+esc(t('savedFavorite')):'♡ '+esc(t('addFavorite'))}</button></div></div></div></section><div class="container detail-layout"><div><section class="detail-section"><h2>${esc(t('story'))}</h2><p>${esc(item.overview||'—')}</p></section>${watch}<section class="detail-section"><h2>${esc(t('cast'))}</h2>${cast}</section></div><aside><section class="legal-card"><h2>${esc(t('legalOptions'))}</h2><p>${esc(t('legalCopy'))}</p><span class="provider-pill">${esc(item.providerName||sourceLabel(item))}</span>${item.licenseUrl?`<a class="btn btn-primary" style="width:100%;margin-top:17px" href="${esc(item.licenseUrl)}" target="_blank" rel="noreferrer">▶ ${esc(t('openLicense'))}</a>`:''}</section>${similar.length?`<section class="detail-section" style="margin-top:28px"><h2>${esc(t('alsoLike'))}</h2><div class="recommend-grid">${similar.map(media=>mediaCard(media)).join('')}</div></section>`:''}</aside></div>`}
function listsPage(){const groups=[['later','◷'],['watched','✓'],['family','⌂'],['shorts','✦']];return `<div class="container page"><section class="page-head"><span class="eyebrow">${esc(bt('listsEye'))}</span><h1 class="page-title">${esc(bt('listsTitle'))}</h1><p class="page-copy">${esc(bt('listsCopy'))}</p></section><section class="section" style="padding-top:8px">${groups.map(([name,icon])=>{const items=state.lists[name]||[];return `<div style="margin-bottom:45px"><div class="section-top"><div><span class="eyebrow">${icon} ${esc(bt(name==='shorts'?'savedShorts':name))}</span><h2 class="section-title">${items.length} ${esc(t('works'))}</h2></div></div>${items.length?`<div class="media-grid">${items.map(item=>mediaCard(item,{overview:true})).join('')}</div>`:empty(icon,bt(name==='shorts'?'savedShorts':name),bt('listsCopy'))}</div>`}).join('')}<div class="cta-band"><span style="font-size:29px;color:var(--accent)">⌕</span><h2>${esc(bt('searchHistory'))}</h2><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:17px">${state.searchHistory.length?state.searchHistory.map(query=>`<button class="btn btn-ghost btn-small" data-action="history-search" data-query="${esc(query)}">${esc(query)}</button>`).join(''):`<span class="status-chip">${esc(t('enterTwoCopy'))}</span>`}</div>${state.searchHistory.length?`<button class="btn btn-ghost btn-small" style="margin-top:17px" data-action="clear-history">${esc(bt('clearHistory'))}</button>`:''}</div><div class="cta-band" style="margin-top:18px"><span style="font-size:29px;color:var(--accent)">◉</span><h2>${esc(bt('hidden'))}</h2><p>${state.hidden.length} ${esc(t('works'))}</p>${state.hidden.length?`<button class="btn btn-ghost btn-small" data-action="restore-hidden">${esc(bt('restoreHidden'))}</button>`:''}</div></section></div>`}
function hydrateBatchUi(){if(routeName()==='search'){const form=document.querySelector('[data-form="search"]');if(form){const history=state.searchHistory.slice(0,5);form.insertAdjacentHTML('afterend',`<div class="container" style="padding-top:15px"><span class="eyebrow">⌕ ${esc(bt('searchHistory'))}</span><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${history.length?history.map(query=>`<button class="btn btn-ghost btn-small" data-action="history-search" data-query="${esc(query)}">${esc(query)}</button>`).join(''):`<span class="status-chip">${esc(t('enterTwoCopy'))}</span>`}</div></div>`)}}if(routeName()==='details'){const item=findMedia(route().split('/')[3]);const target=document.querySelector('.details-intro .btn');if(item&&target){target.insertAdjacentHTML('afterend',`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button class="btn btn-ghost btn-small" data-action="collection" data-list="later" data-id="${esc(item.id)}">${listHas('later',item)?'✓ ':''}${esc(bt('addLater'))}</button><button class="btn btn-ghost btn-small" data-action="collection" data-list="watched" data-id="${esc(item.id)}">${listHas('watched',item)?'✓ ':''}${esc(bt('addWatched'))}</button><button class="btn btn-ghost btn-small" data-action="collection" data-list="family" data-id="${esc(item.id)}">${listHas('family',item)?'✓ ':''}${esc(bt('addFamily'))}</button><button class="btn btn-ghost btn-small" data-action="hide" data-id="${esc(item.id)}">⊘ ${esc(bt('hideSuggestion'))}</button></div>`)}}document.querySelectorAll('video[data-progress-ready="false"]').forEach(video=>{video.dataset.progressReady='true';const item=findMedia(route().split('/')[3]);if(item){const progress=state.watchProgress[key(item)];if(progress&&progress.current>0)video.addEventListener('loadedmetadata',()=>{video.currentTime=Math.min(progress.current,Math.max(0,(video.duration||0)-2))},{once:true});video.addEventListener('timeupdate',()=>noteProgress(item,video.currentTime,video.duration))}})}
function page(){const [_,name,kind,id]=route().split('/');if(name==='search')return searchPage();if(name==='shorts')return shortsPage();if(name==='public-domain')return libraryPage();if(name==='favorites')return favoritesPage();if(name==='lists')return listsPage();if(name==='settings')return settingsPage();if(name==='credits')return creditsPage();if(name==='details')return detailsPage(kind,id);return homePage()}

  async function tvLoad(force=false){const url=TV_PLAYLISTS[tv.country]||TV_PLAYLISTS.YE;const cacheKey=`halapino-user-tv:${tv.country}`;if(tv.loading)return;tv.loading=true;tv.error='';tvRender();try{let text=!force?sessionStorage.getItem(cacheKey):'';if(!text){const response=await fetch(url,{cache:force?'reload':'default'});if(!response.ok)throw new Error('stream list unavailable');text=await response.text();sessionStorage.setItem(cacheKey,text)}tv.channels=tvParseM3U(text,tv.country);tv.categories=[...new Set(tv.channels.flatMap(channel=>channel.categories))].filter(Boolean).sort();tv.active=tv.channels.find(channel=>channel.id===tv.active?.id)||tv.channels[0]||null;tvNotify(`${tv.channels.length} قناة جاهزة`)}catch(error){tv.error='تعذر تحميل قائمة هذا البلد. تحقق من الاتصال ثم أعد المحاولة.'}finally{tv.loading=false;tvRender()}}

  async function tvLoad(force=false){const global=tv.country==='ALL';const source=global?TV_GLOBAL_INDEX:(TV_PLAYLISTS[tv.country]||`https://iptv-org.github.io/iptv/countries/${tv.country.toLowerCase()}.m3u`);const cacheKey=`halapino-user-tv:${global?'GLOBAL':tv.country}`;if(tv.loading)return;tv.loading=true;tv.error='';tv.page=0;tvRender();try{let text=!force?sessionStorage.getItem(cacheKey):'';if(!text){const response=await fetch(source,{cache:force?'reload':'default'});if(!response.ok)throw new Error('stream list unavailable');text=await response.text();sessionStorage.setItem(cacheKey,text)}tv.channels=global?await tvParseWorker(text):tvParseM3U(text,tv.country);tv.categories=[...new Set(tv.channels.flatMap(channel=>channel.categories))].filter(Boolean).sort();tv.active=tv.channels.find(channel=>channel.id===tv.active?.id)||tv.channels[0]||null;tvNotify(`${tv.channels.length.toLocaleString('ar')} قناة جاهزة`)}catch(error){tv.error='تعذر تحميل الدليل الآن. تحقق من اتصالك ثم أعد المحاولة.'}finally{tv.loading=false;tvRender()}}

  function tvLive(){const list=tvVisible().slice(0,100);return `<section class="container page"><div class="page-head"><span class="eyebrow"><span class="tv-live-dot"></span> تلفاز وفيديو</span><h1 class="page-title">شاهد الآن</h1><p class="page-copy">اختر بثاً مباشراً أو افتح مقطعاً جاهزاً، ثم شغّله بصوت من المشغل.</p></div>${tvModes('live')}${tvFilters()}<div class="tv-layout">${tvPlayer()}<aside class="tv-side"><div class="tv-side-head"><h3>القنوات المباشرة</h3><span class="status-chip">${list.length}</span></div>${list.map(tvRow).join('')||tvEmpty('لا توجد قنوات','جرّب فلتراً مختلفاً.')}</aside></div></section>`}

  function tvHome(){const live=tvPaged().rows.slice(0,6);const clips=tv.vod.slice(0,6);return `<section class="hero tv-live-hero"><div class="container"><div class="hero-copy"><span class="tv-live-pill"><span class="tv-live-dot"></span> تلفاز وفيديو من مصادر مفتوحة</span><h1>تجربة تلفاز <em>على طريقتك</em>.</h1><p>بث مباشر للقنوات العالمية، ومقاطع جاهزة تشاهدها متى تريد، في تجربة واحدة خفيفة للهاتف.</p><div class="actions"><button class="btn btn-primary" data-tv-route="live">◉ بث مباشر</button><button class="btn btn-ghost" data-tv-route="clips">▶ مقاطع جاهزة</button></div></div></div></section><section class="container section"><div class="section-top"><div><span class="eyebrow">مباشر الآن</span><h2 class="section-title">قنوات عالمية</h2></div><button class="btn btn-ghost btn-small" data-tv-route="channels">كل القنوات ←</button></div>${live.length?`<div class="media-grid">${live.map(tvCard).join('')}</div>`:tvEmpty('جارٍ التحميل','يتم تجهيز القنوات…')}</section><section class="container section"><div class="section-top"><div><span class="eyebrow">اختر وقتك</span><h2 class="section-title">مقاطع جاهزة</h2></div><button class="btn btn-ghost btn-small" data-tv-route="clips">كل المقاطع ←</button></div>${clips.length?`<div class="media-grid">${clips.map(tvVodCard).join('')}</div>`:`<div class="tv-empty"><div><strong>جاهز للمشاهدة</strong><p>افتح المقاطع لتحميل القائمة الجاهزة.</p><button class="btn btn-primary" data-tv-route="clips">فتح المقاطع</button></div></div>`}</section>`}

  async function tvMount(channel,withSound=false){const video=tv$('#tv-video');if(!video||!channel?.stream)return;const holder=tv$('#tv-placeholder');if(holder)holder.classList.add('hidden');if(tv.hls){tv.hls.destroy();tv.hls=null}video.pause();video.removeAttribute('src');video.muted=!withSound;video.defaultMuted=!withSound;video.volume=1;await tvLoadHls();const attempt=()=>video.play().then(()=>{if(withSound)tvNotify('الصوت يعمل')}).catch(()=>{if(withSound)tvNotify('اضغط تفعيل الصوت للسماح بالتشغيل')});if(window.Hls&&Hls.isSupported()&&/\.m3u8($|\?)/i.test(channel.stream)){tv.hls=new Hls({enableWorker:true,lowLatencyMode:true});tv.hls.loadSource(channel.stream);tv.hls.attachMedia(video);tv.hls.on(Hls.Events.MANIFEST_PARSED,attempt);tv.hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)tvNotify('تعذر تشغيل هذا المصدر داخل المتصفح')})}else{video.src=channel.stream;video.addEventListener('loadedmetadata',attempt,{once:true});video.load()}}
